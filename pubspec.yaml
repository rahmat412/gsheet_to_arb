homepage: https://github.com/rahmat412/gsheet_to_arb

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  args: ^2.7.0
  dart_style: ^3.1.3
  intl: ^0.20.2
  path: ^1.9.1
