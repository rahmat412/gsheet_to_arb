  googleapis: ^15.0.0
  code_builder: ^4.11.0
  intl_translation: ^0.21.0
  json_annotation: ^4.9.0
  file_utils: ^1.0.1
  logging: ^1.3.0
  recase: ^4.1.0
  quiver: ^3.2.2
  yaml: ^3.1.3
